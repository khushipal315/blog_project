{% extends 'blog/base.html' %}

{% block title %}
Create Blog
{% endblock %}


{% block content %}

<div class="container form-container">

    <div class="form-card">

        <h2>Create New Blog</h2>

        <p class="text-muted">
            Share your thoughts with the world.
        </p>


        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}


            <button
                type="submit"
                class="btn btn-dark">

                Publish Blog

            </button>


            <a
                href="{% url 'home' %}"
                class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
