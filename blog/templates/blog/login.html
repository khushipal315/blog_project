{% extends 'blog/base.html' %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="container auth-container">

    <div class="auth-card">

        <h2>Welcome Back</h2>

        <p>
            Login to your account
        </p>


        <form method="POST">

            {% csrf_token %}


            <div class="mb-3">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>

            </div>


            <div class="mb-3">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-dark w-100">

                Login

            </button>

        </form>


        <p class="mt-3">

            Don't have an account?

            <a href="{% url 'signup' %}">
                Sign Up
            </a>

        </p>

    </div>

</div>

{% endblock %}
